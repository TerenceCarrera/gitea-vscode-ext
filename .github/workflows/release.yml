name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: corepack enable
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Package
        run: npx @vscode/vsce package --out gitea-vscode-${{ github.ref_name }}.vsix

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: gitea-vscode-${{ github.ref_name }}.vsix
          body: |
            See [CHANGELOG.md](CHANGELOG.md) for details.
          generate_release_notes: false
